[package]
name = "moleucle_3dview_rs"
version = "0.10.0"
edition = "2021"
description = "A lightweight 3D molecule visualization library for egui, rendering through wgpu."
license = "MIT"
repository = "https://github.com/IndigoCarmine/moleucle_3dview_rs"
keywords = ["molecule", "visualization", "3d", "graphics", "bioinformatics"]
categories = ["visualization", "science"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
lin_alg = { version = "1.4.3", features = ["computer_graphics"] }

[dev-dependencies]
tempfile = "3.27.0"
naga = { version = "30.0.0", features = ["wgsl-in"] }

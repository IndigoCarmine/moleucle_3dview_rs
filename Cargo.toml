[package]
name = "moleucle_3dview_rs"
version = "0.6.0"
edition = "2021"
description = "A lightweight 3D molecule visualization library utilizing the graphics crate."
license = "MIT"
repository = "https://github.com/taman/moleucle_3dview_rs"
keywords = ["molecule", "visualization", "3d", "graphics", "bioinformatics"]
categories = ["visualization", "science"]

[dependencies]
bio_files = "0.5.2"
bytemuck = { version = "1.25.0", features = ["derive"] }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.34.3"
egui-wgpu = "0.34.3"
lin_alg = { version = "1.4.3", features = ["computer_graphics"] }
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.27.0"
naga = { version = "29", features = ["wgsl-in"] }
